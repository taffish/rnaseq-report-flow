[package]
name = "rnaseq-report-flow"
kind = "flow"
version = "0.1.0"
release = 1
license = "Apache-2.0"
main = "src/main.taf"

[repository]
url = "https://github.com/taffish/rnaseq-report-flow"

[command]
name = "taf-rnaseq-report-flow"

[runtime]
pipe = false
command_mode = false

[meta]
domain = "bio"
categories = ["rna-seq", "report", "workflow", "transcriptomics", "provenance"]
keywords = ["rnaseq-report-flow", "rna-seq", "report", "summary", "provenance", "HTML", "transcriptomics"]
description = "TAFFISH RNA-seq report flow that collects upstream RNA-seq flow outputs into a static project report, summaries, methods, versions, commands, and provenance."

[upstream]
name = "rnaseq-report-flow"
type = "taffish-flow"
homepage = "https://github.com/taffish/rnaseq-report-flow"
version = "0.1.0"
license = "Apache-2.0"
description = "TAFFISH-maintained RNA-seq static report collector for versioned upstream RNA-seq flow outputs."
